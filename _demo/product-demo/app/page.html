<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Coach · meeting</title>
<link rel="stylesheet" href="ds/styles.css">
<link rel="stylesheet" href="styles.css">
<style>
  /* Demo-only overrides: no prototype chrome or debug sections, and no CSS motion, so every
     frame the recorder captures is decided by scene.html's clock. */
  *, *::before, *::after { transition: none !important; animation: none !important; }
  html, body { background: var(--bg-0); scrollbar-width: none; }
  body::-webkit-scrollbar { display: none; }
  .topbar, .section.cost { display: none !important; }
  .page { padding: 30px 40px 80px; gap: 22px; }
  .ch.hov { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(26,46,34,.10); z-index: 2; }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand"><span class="dot"></span>Work Coach</span>
  <div class="picker"><input id="search"><div id="list" class="list" hidden></div></div>
  <span id="origin" class="muted"></span>
  <span class="spacer"></span>
  <button id="analyze" class="btn primary" hidden>Analyze</button>
  <button id="rerun" class="btn" hidden>Re-run</button>
</header>
<main id="page" class="page"></main>
<audio id="audio" preload="none"></audio>
<script src="fixture.js"></script>
<script src="app.js"></script>
</body>
</html>
